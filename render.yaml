services:
  - type: web
    name: debwan-live-api
    runtime: docker
    repo: https://github.com/mghalaosimi-web/debwan-live
    branch: feature/football-hub-official-free-sources
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_PORT
        value: "10000"
      - key: BASE_URL
        value: https://debwan-live-football-web.onrender.com
      - key: CORS_ALLOW_ORIGINS
        value: https://debwan-live-football-web.onrender.com
      - key: DB_HOST
        fromDatabase:
          name: debwan-live-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: debwan-live-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: debwan-live-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: debwan-live-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: debwan-live-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: DB_MAX_IDLE_CONNS
        value: "2"
      - key: DB_MAX_OPEN_CONNS
        value: "10"
      - key: REDIS_HOST
        fromService:
          name: debwan-live-cache
          type: keyvalue
          property: host
      - key: REDIS_PORT
        fromService:
          name: debwan-live-cache
          type: keyvalue
          property: port
      - key: REDIS_PASSWORD
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@debwan.local
      - key: SEED_IPTV
        value: "false"
      - key: MEDIA_PATH
        value: /tmp/media
      - key: LIBRARY_PATH
        value: /tmp/library
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: FFPROBE_PATH
        value: /usr/bin/ffprobe
